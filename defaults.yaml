# 所有客戶共用的預設值。客戶檔 clients/*.yaml 裡寫的會「疊加」在這上面。

# 每次 fetch 讀取人工搜尋表。可用 --workbook 改路徑，或 --no-workbook 暫停。
# search_workbook（Excel 搜尋清單路徑）寫在只留本機的 defaults.local.yaml

# 檔案怎麼分資料夾。可用變數：{client} 客戶代號、{name} 客戶名、
# {date} 2026-09-21、{ym} 2026-09、{yyyy}、{mm}、{dd}
# 想改回全部平放就寫 "{date}-{client}.md"；改完跑 ./monitor tidy 搬移舊檔。
paths:
  candidates: "{client}/{ym}/{date}-{client}.md"
  reports: "{client}/{ym}/{date}-{client}.md"

# 網域 → 報告裡要顯示的媒體名（Google News 有時只給網域或英文名）
# 想改成客戶習慣的叫法，直接改右邊字串即可。
